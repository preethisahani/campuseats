<!-- Login Form -->
<form class="space-y-lg">
<!-- Email/ID Field -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-deep-teal block ml-sm" for="email">Campus ID or Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-blue transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-soft-blue/50 text-deep-teal font-body-md text-body-md rounded-lg py-md pl-3xl pr-md focus:border-primary-blue focus:ring-0 focus:shadow-level-1 transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="e.g. jdoe@campus.edu" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center ml-sm mr-sm">
<label class="font-label-bold text-label-bold text-deep-teal block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary-blue hover:text-secondary transition-colors underline-offset-2 hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-blue transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-soft-blue/50 text-deep-teal font-body-md text-body-md rounded-lg py-md pl-3xl pr-md focus:border-primary-blue focus:ring-0 focus:shadow-level-1 transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-deep-teal focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Terms (Optional/Contextual) -->
<div class="flex items-center pl-sm">
<input class="w-4 h-4 rounded border-soft-blue/50 text-primary-blue focus:ring-primary-blue focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="ml-sm font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>

<button class="w-full bg-accent-orange hover:bg-[#e67424] text-white font-label-bold text-label-bold rounded-lg py-md shadow-level-1 hover:shadow-level-2 transition-all transform hover:-translate-y-[1px] active:translate-y-0 active:scale-[0.98] flex items-center justify-center gap-sm group" type="submit">

</button>
